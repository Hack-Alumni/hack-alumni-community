services:
  # Member Profile App (Frontend)
  - type: web
    name: hack-alumni-member-profile
    env: node
    plan: free
    buildCommand: yarn install && yarn workspace @hackcommunity/member-profile build
    startCommand: yarn workspace @hackcommunity/member-profile start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QSTASH_TOKEN
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
    healthCheckPath: /health
    autoDeploy: true

  # API Service
  - type: web
    name: hack-alumni-api
    env: node
    plan: free
    buildCommand: yarn install && yarn workspace @hackcommunity/api build
    startCommand: yarn workspace @hackcommunity/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QSTASH_TOKEN
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
    healthCheckPath: /health
    autoDeploy: true

  # Cron Jobs (Background Jobs Service)
  - type: web
    name: hack-alumni-cron-service
    env: node
    plan: free
    buildCommand: yarn install && yarn workspace @hackcommunity/api build
    startCommand: yarn workspace @hackcommunity/api start:cron
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QSTASH_TOKEN
        sync: false
      - key: UPSTASH_QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: UPSTASH_QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
    healthCheckPath: /health
    autoDeploy: true
